<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Оқушыларды 3 топқа бөлу</title>
<style>
    body { font-family: Arial; padding: 20px; }
    h1 { color: #333; }
    input { padding: 8px; width: 300px; margin-top: 10px; }
    button { padding: 8px 16px; margin-left: 10px; font-size: 16px; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #333; padding: 8px; text-align: left; vertical-align: top; }
    th { background-color: #f2f2f2; }
</style>
</head>
<body>

<h1>Оқушыларды 3 топқа рандом бөлу</h1>

<label>Оқушының аты-жөні:</label><br>
<input type="text" id="studentName" placeholder="Атыңызды енгізіңіз">
<button id="assignBtn">Тобыңызды білу</button>

<table id="groupTable">
    <tr>
        <th>Арифметика</th>
        <th>Прогрессия</th>
        <th>Тізбек</th>
    </tr>
    <tr>
        <td id="arif"></td>
        <td id="prog"></td>
        <td id="tizb"></td>
    </tr>
</table>

<script>
const groups = [
    {name: "Арифметика", element: document.getElementById("arif"), students: []},
    {name: "Прогрессия", element: document.getElementById("prog"), students: []},
    {name: "Тізбек", element: document.getElementById("tizb"), students: []}
];

let totalStudents = 0;
const MAX_STUDENTS = 20;

function assignGroup() {
    const input = document.getElementById("studentName");
    const name = input.value.trim();

    if(!name) { alert("Атыңызды енгізіңіз!"); return; }
    if(totalStudents >= MAX_STUDENTS) { alert("Барлық 20 оқушы енгізілді!"); return; }

    // Рандом топ таңдау, теңдей болуына тырысу
    const maxPerGroup = Math.ceil(MAX_STUDENTS / 3);
    const availableGroups = groups.filter(g => g.students.length < maxPerGroup);
    const randomGroup = availableGroups[Math.floor(Math.random() * availableGroups.length)];

    randomGroup.students.push(name);
    randomGroup.element.innerHTML = randomGroup.students.join("<br>");

    totalStudents++;
    input.value = "";
    input.focus();
}

// Enter немесе батырма арқылы
document.getElementById("assignBtn").addEventListener("click", assignGroup);
document.getElementById("studentName").addEventListener("keydown", function(e){
    if(e.key === "Enter") assignGroup();
});
</script>

</body>
</html>
